

<html lang="ES">

<head>
    <title>FishWeb</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

    <div class="header">
        <h1>FishWeb</h1>
    </div>

    <div class="navbar">
        <a href="#">Fisher Profile</a>
        <a href="#">Catch-It</a>
        <a href="#">Fishcyclopedia</a>
    </div>

    <div class="row">
        <div class="column side">
            <h2 id="user">User</h2>
            <img src="img_avatar.jpg" alt="Avatar" id="avatar">
        </div>
        <div class="column middle">
            <h2>Recent Activity</h2>
            <div class="userfeed">
                <p style="color: grey">Recent activity</p>
            </div>
        </div>
        <div class="column side">
            <h2>Log-in</h2>
            <p>Username</p>
            <input type="text" id="username">
            <p>Password</p>
            <input type="password" id="password">
            <br>
            <input type="button" value="Log-in" id="loginButton" onclick="login()">
        </div>
    </div>

</body>
</html>
