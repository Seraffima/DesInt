<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FishWeb</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
<div class="header">
    <h1>FishWeb</h1>
</div>

<div class="navbar">
    <a href="index.html" id="profileLink">Profile</a>
    <a href="feed.html" id="catchItLink">Recent Catches</a>
    <a href="#" id="encyclopediaLink">Fishcyclopedia</a>
</div>

<div class="content">
    <div class="side_column">
        <h2>Profile</h2>
        <div id="profile"></div>
        <form id="loginForm">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <button type="button" id="loginButton">Login</button>
        </form>
    </div>
    <div class="column_middle" id="mainContent">
        <h2>Recent Catches</h2>
        <div id="recentCatchesList"></div>
    </div>
    <div class="column_middle" id="encyclopediaContent" style="display:none;">
        <h2>Fishcyclopedia</h2>
        <div id="fishList"></div>
    </div>
</div>
<script src="app.js" defer></script>
</body>
</html>
